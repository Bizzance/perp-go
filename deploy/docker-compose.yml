# perp-go 服务编排：只包含两个应用服务，MySQL/Redis/Kafka通过环境变量指向外部(生产用托管服务)。
# 测试/联调环境需要连依赖一起拉起来，叠加docker-compose.deps.yml：
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml -f deploy/docker-compose.deps.yml up -d --build
# 生产环境只用本文件：
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d
# 详见docs/deployment.md

name: perpgo

x-common-env: &common-env
  GIN_MODE: release
  TZ: ${TZ:-UTC}
  PERP_MYSQL_DSN: ${PERP_MYSQL_DSN:?必须设置PERP_MYSQL_DSN}
  PERP_REDIS_ADDR: ${PERP_REDIS_ADDR:?必须设置PERP_REDIS_ADDR}
  PERP_REDIS_PASS: ${PERP_REDIS_PASS:?必须设置PERP_REDIS_PASS}
  PERP_KAFKA_BROKER: ${PERP_KAFKA_BROKER:?必须设置PERP_KAFKA_BROKER}
  # 接口鉴权：默认开启，必须配置至少一把密钥，否则进程拒绝启动，见docs/auth-design.md。
  # PERP_AUTH_DISABLED=true只给本地开发用，生产绝对不能设
  PERP_API_KEYS: ${PERP_API_KEYS:-}
  PERP_AUTH_DISABLED: ${PERP_AUTH_DISABLED:-false}
  # 标记价：由指数价、盘口基差、最新成交价取中位数得出，见docs/mark-price.md。
  # PERP_MARK_REQUIRE_INDEX=true时没有指数价就不产生标记价(生产必须开)；留空的项用代码里的默认值
  PERP_MARK_REQUIRE_INDEX: ${PERP_MARK_REQUIRE_INDEX:-false}
  PERP_MARK_MAX_INDEX_AGE_SEC: ${PERP_MARK_MAX_INDEX_AGE_SEC:-}
  PERP_MARK_MAX_DEVIATION: ${PERP_MARK_MAX_DEVIATION:-}
  PERP_MARK_BASIS_WINDOW_SEC: ${PERP_MARK_BASIS_WINDOW_SEC:-}
  # POST /index-price的服务端跳变保护(只有api用得上)：一次推送相对当前指数价变动超过这个比例就要等新价位持续
  # CONFIRM_SEC秒才承认。留空=不校验(测试环境、模拟客户端会故意大幅改价)，生产设成0.05，见docs/mark-price.md
  PERP_INDEX_MAX_JUMP: ${PERP_INDEX_MAX_JUMP:-}
  PERP_INDEX_JUMP_CONFIRM_SEC: ${PERP_INDEX_JUMP_CONFIRM_SEC:-}

services:
  # 有状态：订单簿在内存里，重启时从MySQL重建。默认单实例，同一个symbol的订单簿只能在
  # 一个实例里，扩容按symbol分片见docs/engine-sharding.md
  engine:
    image: perp-go/engine:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: engine
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    # 给进程足够时间收到SIGTERM后干净退出
    stop_grace_period: 30s
    environment:
      <<: *common-env
      PERP_ENGINE_HTTP_ADDR: ":7002"
      PERP_NODE_ID: ${ENGINE_NODE_ID:-1}
      PERP_ENGINE_SYMBOLS: ${PERP_ENGINE_SYMBOLS:-}
    # 默认只绑本机回环地址：目前没有鉴权，不能直接暴露到网络。生产在前面放带鉴权/TLS的
    # 网关，网关和这台机器通网时再把BIND_ADDR改成0.0.0.0(或内网地址)
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${ENGINE_PORT:-7002}:7002"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7002/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # 无状态：可以多实例，但每个实例的PERP_NODE_ID必须不同(雪花ID用)，见docs/deployment.md
  api:
    image: perp-go/api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *common-env
      PERP_API_ADDR: ":7001"
      PERP_NODE_ID: ${API_NODE_ID:-0}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-7001}:7001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7001/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    # 先等engine健康再起api：engine启动时会先重建订单簿，api不依赖它启动，但这样顺序更符合
    # 直觉，避免刚启动时下单事件堆在Kafka里
    depends_on:
      engine:
        condition: service_healthy
    logging: *logging

  # 指数价喂价：从币安、OKX、Bybit取指数价，取中位数后推给api的POST /index-price。标记价靠它做锚，
  # 喂价断了强平会暂停，见docs/index-feeder.md。**生产必须开**：在deploy/.env里设COMPOSE_PROFILES=feeder。
  # 测试环境默认不开(模拟客户端的系统做市在喂指数价，两个喂价方会互相覆盖)。
  # 需要ops权限的密钥，FEEDER_API_KEY_ID/FEEDER_API_SECRET要跟PERP_API_KEYS里的一把对上
  feeder:
    profiles: ["feeder"]
    image: perp-go/feeder:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: feeder
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      FEEDER_API_URL: http://api:7001
      FEEDER_API_KEY_ID: ${FEEDER_API_KEY_ID:-}
      FEEDER_API_SECRET: ${FEEDER_API_SECRET:-}
      FEEDER_SYMBOLS: ${FEEDER_SYMBOLS:-}
      FEEDER_SOURCES: ${FEEDER_SOURCES:-}
      FEEDER_MIN_SOURCES: ${FEEDER_MIN_SOURCES:-}
      FEEDER_OUTLIER: ${FEEDER_OUTLIER:-}
      FEEDER_MAX_JUMP: ${FEEDER_MAX_JUMP:-}
      FEEDER_JUMP_CONFIRM: ${FEEDER_JUMP_CONFIRM:-}
      FEEDER_INTERVAL_MS: ${FEEDER_INTERVAL_MS:-}
      FEEDER_HEALTH_MAX_AGE_SEC: ${FEEDER_HEALTH_MAX_AGE_SEC:-}
    # 状态端口7003不映射到宿主机(FEEDER_HTTP_ADDR保持默认，健康检查依赖它)：有合约超过
    # FEEDER_HEALTH_MAX_AGE_SEC没成功发布就返回503，容器变unhealthy。restart: unless-stopped只在进程退出时重启，
    # 不会因为unhealthy重启，所以这是给监控看的信号，不是自愈，见docs/index-feeder.md"状态和健康检查"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7003/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
